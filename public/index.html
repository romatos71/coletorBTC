<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Monitor Bitcoin & Carteira</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
    <div class="max-w-6xl mx-auto space-y-6">
        
        <h1 class="text-3xl font-bold text-gray-800">Painel Bitcoin - OpenShift Sandbox</h1>

        <!-- Caixa de Cálculo de Posse -->
        <div class="bg-white p-6 rounded-lg shadow-md flex items-center justify-between">
            <div>
                <label class="block text-sm font-medium text-gray-700">Quanto de Bitcoin você possui?</label>
                <input type="number" id="btcAmount" step="0.00001" placeholder="Ex: 0.1" class="mt-1 p-2 border rounded-md w-48" oninput="calculatePortfolio()">
            </div>
            <div class="text-right">
                <p class="text-sm text-gray-500">Valor Atual (USD): <span id="currentUsd" class="font-bold text-black">$0.00</span></p>
                <p class="text-sm text-gray-500">Valor Atual (BRL): <span id="currentBrl" class="font-bold text-black">R$ 0,00</span></p>
                <p class="text-lg font-semibold text-green-600 mt-1">Seu Patrimônio: <span id="portfolioValue">R$ 0,00</span></p>
            </div>
        </div>

        <!-- Gráfico -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <canvas id="btcChart" height="100"></canvas>
        </div>

        <!-- Lista / Tabela no formato solicitado -->
        <div class="bg-white p-6 rounded-lg shadow-md overflow-x-auto">
            <h2 class="text-xl font-bold mb-4 text-gray-800">Histórico de Coletas</h2>
            <table class="min-w-full divide-y divide-gray-200 text-sm">
                <thead>
                    <tr>
                        <th class="px-4 py-2 text-left font-semibold text-gray-600">Fonte</th>
                        <th class="px-4 py-2 text-left font-semibold text-gray-600">Data</th>
                        <th class="px-4 py-2 text-left font-semibold text-gray-600">Hora</th>
                        <th class="px-4 py-2 text-left font-semibold text-gray-600">Valor em Dólar</th>
                        <th class="px-4 py-2 text-left font-semibold text-gray-600">Valor em Real</th>
                    </tr>
                </thead>
                <tbody id="btcTableBody" class="divide-y divide-gray-200">
                    <!-- Preenchido via JavaScript -->
                </tbody>
            </table>
        </div>

    </div>

    <script>
        let latestBrl = 0;
        let latestUsd = 0;
        let chartInstance = null;

        // Configuração inicial do Gráfico com Chart.js
        const ctx = document.getElementById('btcChart').getContext('2d');
        const btcChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Bitcoin (BRL)',
                    data: [],
                    borderColor: 'rgb(34, 197, 94)',
                    tension: 0.1
                }]
            },
            options: { responsive: true }
        });

        async function fetchData() {
            try {
                const response = await fetch('/api/bitcoin');
                const data = await response.json();
                
                if (!data.latest) return;

                latestUsd = data.latest.usd;
                latestBrl = data.latest.brl;
                
                document.getElementById('currentUsd').innerText = `$ ${latestUsd.toLocaleString()}`;
                document.getElementById('currentBrl').innerText = `R$ ${latestBrl.toLocaleString()}`;
                calculatePortfolio();

                updateTable(data.history);
                updateChart(data.history);
            } catch (e) {
                console.error("Erro ao buscar dados:", e);
            }
        }

        function calculatePortfolio() {
            const amount = parseFloat(document.getElementById('btcAmount').value) || 0;
            const totalBrl = amount * latestBrl;
            document.getElementById('portfolioValue').innerText = `R$ ${totalBrl.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        }

        function updateTable(history) {
            const tbody = document.getElementById('btcTableBody');
            tbody.innerHTML = '';
            // Mostra os mais recentes primeiro (últimos 20)
            history.slice(-20).reverse().forEach(item => {
                const dateObj = new Date(item.timestamp);
                const dateStr = dateObj.toLocaleDateString();
                const timeStr = dateObj.toLocaleTimeString();

                const row = `<tr>
                    <td class="px-4 py-2">${item.source}</td>
                    <td class="px-4 py-2">${dateStr}</td>
                    <td class="px-4 py-2">${timeStr}</td>
                    <td class="px-4 py-2">$ ${item.usd.toLocaleString()}</td>
                    <td class="px-4 py-2">R$ ${item.brl.toLocaleString()}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        function updateChart(history) {
            // Pega os últimos 50 pontos para o gráfico não ficar poluído
            const recentHistory = history.slice(-50);
            btcChart.data.labels = recentHistory.map(item => new Date(item.timestamp).toLocaleTimeString());
            btcChart.data.datasets[0].data = recentHistory.map(item => item.brl);
            btcChart.update();
        }

        // Atualiza a cada 5 segundos
        setInterval(fetchData, 5000);
        fetchData();
    </script>
</body>
</html>
